
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>SubDomain Finder</title>
</head>
<body>

<h1>SubDomain Finder</h1>

<input id="domain" placeholder="deltarune.com" size="35">

<button onclick="findPages()">Find pages</button>
<button onclick="stopSearch()">Stop</button>
<button onclick="clearResults()">Clear</button>
<button onclick="downloadResults()">Download TXT</button>

<p id="status">Ready.</p>
<p id="count">Pages found: 0</p>

<div id="results"></div>

<script>
let pages = new Set();
let stopped = false;

function normalizeDomain(value) {
    value = value.trim();

    if (!/^https?:\/\//i.test(value)) {
        value = "https://" + value;
    }

    const url = new URL(value);

    if (!["https:", "http:"].includes(url.protocol)) {
        throw new Error("Invalid protocol");
    }

    return url.hostname.toLowerCase().replace(/\.$/, "");
}

function updateResults() {
    const container = document.getElementById("results");
    const sorted = [...pages].sort();

    container.replaceChildren();

    document.getElementById("count").textContent =
        "Pages found: " + sorted.length;

    for (const page of sorted) {
        const link = document.createElement("a");
        link.href = page;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = page;

        container.appendChild(link);
        container.appendChild(document.createElement("br"));
    }
}

async function findPages() {
    stopped = false;
    pages.clear();
    updateResults();

    let domain;

    try {
        domain = normalizeDomain(
            document.getElementById("domain").value
        );

        if (!domain.includes(".")) throw new Error();
    } catch (error) {
        document.getElementById("status").textContent =
            "Enter a valid domain.";
        return;
    }

    document.getElementById("status").textContent =
        "Loading Common Crawl indexes...";

    try {
        const response = await fetch(
            "https://index.commoncrawl.org/collinfo.json"
        );

        if (!response.ok) {
            throw new Error("Cannot load index list: HTTP " +
                response.status);
        }

        const indexes = await response.json();

        // Search the three most recent available archives.
        for (const index of indexes.slice(0, 3)) {
            if (stopped) break;

            document.getElementById("status").textContent =
                "Searching archive " + index.id + "...";

            // Search both the domain and its subdomains.
            const patterns = [
                domain + "/*",
                "*." + domain + "/*"
            ];

            for (const pattern of patterns) {
                if (stopped) break;

                const api = new URL(index.cdxapi);
                api.searchParams.set("url", pattern);
                api.searchParams.set("output", "json");
                api.searchParams.set("filter", "status:200");
                api.searchParams.set("collapse", "urlkey");

                const result = await fetch(api.toString());

                if (!result.ok) {
                    if (result.status === 503 ||
                        result.status === 429) {
                        throw new Error(
                            "Common Crawl rate limit reached. Try later."
                        );
                    }

                    continue;
                }

                const text = await result.text();

                for (const line of text.split(/\r?\n/)) {
                    if (!line.trim()) continue;

                    try {
                        const item = JSON.parse(line);
                        const url = new URL(item.url);
                        const host = url.hostname.toLowerCase();

                        if (
                            host === domain ||
                            host.endsWith("." + domain)
                        ) {
                            pages.add(url.href);
                        }
                    } catch (error) {}
                }

                updateResults();
            }
        }

        document.getElementById("status").textContent =
            stopped
                ? "Search stopped."
                : "Finished. Results are from archived crawls.";

    } catch (error) {
        document.getElementById("status").textContent =
            "Error: " + error.message +
            ". The API may be unavailable or blocked by CORS.";
    }

    updateResults();
}

function stopSearch() {
    stopped = true;
    document.getElementById("status").textContent =
        "Stopping search...";
}

function clearResults() {
    stopped = true;
    pages.clear();
    document.getElementById("domain").value = "";
    document.getElementById("status").textContent = "Ready.";
    updateResults();
}

function downloadResults() {
    const text = [...pages].sort().join("\n");

    if (!text) {
        document.getElementById("status").textContent =
            "Nothing to download.";
        return;
    }

    const blob = new Blob([text], {
        type: "text/plain;charset=utf-8"
    });

    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");

    link.href = url;
    link.download = "found-pages.txt";
    link.click();

    setTimeout(() => URL.revokeObjectURL(url), 1000);
}
</script>

</body>
</html>
